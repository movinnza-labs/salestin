# Flat, npm-style node_modules without symlinks. Hosts that copy the app folder
# (e.g. Hostinger) break pnpm's default symlinked layout.
nodeLinker: hoisted

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true

# Patched versions of vulnerable transitive dependencies (pnpm audit).
overrides:
  dompurify: ^3.4.17
  happy-dom: ^21.0.4
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
